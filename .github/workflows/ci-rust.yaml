---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "CI (Rust)"

# No `paths:` filter on the triggers. A workflow skipped by one reports no check at
# all, which a required status check can never satisfy. The `changes` job below does
# the filtering instead, and `Rust CI` always runs and always reports — that is the
# job to mark required.
on: # yamllint disable-line rule:truthy
  pull_request:
  push:
    branches: ["main"]
  # Called by cd-c10r.yaml, so a tag publishes only what these checks passed on.
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Pull requests filter against the merge base, pushes against the commits the push
  # advanced over. A tag, a manual run, and any push whose prior commit is unavailable
  # (a new branch, a force-push) build everything, because there is nothing to diff.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      rust: "${{ steps.filter.outputs.rust }}"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the merge base has to be reachable
          persist-credentials: false

      - name: Filter
        id: filter
        shell: bash
        env:
          EVENT: "${{ github.event_name }}"
          REF: "${{ github.ref }}"
          BASE: "${{ github.event.pull_request.base.sha }}"
          BEFORE: "${{ github.event.before }}"
          SHA: "${{ github.sha }}"
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000

          range=""
          if [[ "${REF}" == refs/tags/* ]]; then
              : # a release tests everything
          elif [[ "${EVENT}" == pull_request && -n "${BASE}" ]]; then
              range="${BASE}...HEAD"
          elif [[ "${EVENT}" == push && -n "${BEFORE}" && "${BEFORE}" != "${zero}" ]] \
              && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              range="${BEFORE}..${SHA}"
          fi

          if [[ -z "${range}" ]]; then
              echo "no diffable range; building everything" >&2
              echo "rust=true" >>"${GITHUB_OUTPUT}"
              exit 0
          fi

          echo "filtering over ${range}" >&2
          if git diff --name-only "${range}" | grep -qE \
              '^(src/|tests/|build\.rs|Cargo\.(toml|lock)|rust-toolchain\.toml|models/[^/]*\.manifest\.json|\.github/workflows/ci-rust\.yaml)'; then
              echo "rust=true" >>"${GITHUB_OUTPUT}"
          else
              echo "rust=false" >>"${GITHUB_OUTPUT}"
          fi

  check:
    name: Format, lint, test
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads rust-toolchain.toml, so the channel matches what everyone develops
      # against. The components are named again here because the tests depend on
      # rust-analyzer being present, and a silent omission surfaces only as a
      # confusing failure deep inside the suite.
      - name: Install the pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: rust-analyzer, rust-src

      # `c10r build` shells out to `rust-analyzer`, and the tests run it from temporary
      # workspaces outside this repository. There, rust-toolchain.toml does not apply and
      # the rustup proxy resolves the runner's default toolchain, which carries no
      # rust-analyzer component — so the proxy runs and exits non-zero. Pinning
      # RUSTUP_TOOLCHAIN makes the proxies resolve this toolchain from any directory.
      - name: Pin the toolchain for the rustup proxies
        shell: bash
        run: |
          set -euo pipefail
          RUSTUP_TOOLCHAIN="$(rustup show active-toolchain | cut -d' ' -f1)"
          export RUSTUP_TOOLCHAIN
          echo "RUSTUP_TOOLCHAIN=${RUSTUP_TOOLCHAIN}" >>"${GITHUB_ENV}"
          # Prove it resolves outside the repository, where the tests will run it.
          cd "${RUNNER_TEMP}"
          rust-analyzer --version

      # build.rs downloads the embedding model from the revision the manifest pins and
      # verifies every file's SHA-256. Caching on the manifest's own hash means a cache
      # hit is by construction the payload that manifest describes.
      - name: Cache the embedding model payload
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models/potion-code-16M-v2
          key: model-${{ hashFiles('models/potion-code-16M-v2.manifest.json') }}

      - name: Check formatting
        run: cargo fmt --all --check

      # Release profile throughout: the tests embed and run the model and drive
      # rust-analyzer over real crates, which is far slower unoptimized, and clippy
      # then shares the one build directory instead of compiling the tree twice.
      # `--locked` throughout: CI must test the committed dependency resolution, not one
      # cargo re-resolves on the runner.
      - name: Lint
        run: cargo clippy --release --locked --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --release --locked

  # The required status check. It runs on every event, so it always reports: green
  # when the checks passed or had nothing to do, red when they failed.
  required:
    name: Rust CI
    needs: [changes, check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report
        shell: bash
        env:
          CHANGES: "${{ needs.changes.result }}"
          CHECK: "${{ needs.check.result }}"
        run: |
          set -euo pipefail
          if [ "${CHANGES}" != success ]; then
              echo "change detection ${CHANGES}" >&2
              exit 1
          fi
          case "${CHECK}" in
              success | skipped) ;;
              *) echo "checks ${CHECK}" >&2; exit 1 ;;
          esac
