---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "CI (Python)"

# No `paths:` filter on the triggers; see the note in ci-rust.yaml. `Python CI` is
# the job to mark required.
on: # yamllint disable-line rule:truthy
  pull_request:
  push:
    branches: ["main"]
  # Called by cd-mcp.yaml, so a tag publishes only what these checks passed on.
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Only a pull request is filtered. A push to main, a tag release through
  # `workflow_call`, and a manual run all test everything.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      mcp: "${{ steps.filter.outputs.mcp }}"
      evals: "${{ steps.filter.outputs.evals }}"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the merge base has to be reachable
          persist-credentials: false

      - name: Filter
        id: filter
        shell: bash
        env:
          BASE: "${{ github.event.pull_request.base.sha }}"
        run: |
          set -euo pipefail
          if [ -z "${BASE}" ]; then
              echo "mcp=true" >>"${GITHUB_OUTPUT}"
              echo "evals=true" >>"${GITHUB_OUTPUT}"
              exit 0
          fi
          changed="$(git diff --name-only "${BASE}...HEAD")"

          # The MCP tests drive the built binary, so a crate change is an MCP change.
          if grep -qE '^(mcp/|src/|build\.rs|Cargo\.(toml|lock)|rust-toolchain\.toml|models/[^/]*\.manifest\.json|\.github/workflows/ci-python\.yaml)' <<<"${changed}"; then
              echo "mcp=true" >>"${GITHUB_OUTPUT}"
          else
              echo "mcp=false" >>"${GITHUB_OUTPUT}"
          fi

          if grep -qE '^(evals/|\.github/workflows/ci-python\.yaml)' <<<"${changed}"; then
              echo "evals=true" >>"${GITHUB_OUTPUT}"
          else
              echo "evals=false" >>"${GITHUB_OUTPUT}"
          fi

  mcp:
    name: MCP server
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The MCP tests drive the real `c10r` binary against real indexes — nothing is
      # stubbed — so this job builds the binary the tests discover at target/release/c10r,
      # and needs the rust-analyzer component that `c10r build` shells out to.
      - name: Install the pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Cache the embedding model payload
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models/potion-code-16M-v2
          key: model-${{ hashFiles('models/potion-code-16M-v2.manifest.json') }}

      - name: Build c10r
        run: cargo build --release --locked

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Test
        working-directory: mcp
        run: uv run --frozen pytest

  evals:
    name: Evaluation harness
    needs: changes
    if: needs.changes.outputs.evals == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Lint
        working-directory: evals
        run: uv run --frozen ruff check .

      - name: Test
        working-directory: evals
        run: uv run --frozen pytest

  # The required status check; see the note in ci-rust.yaml.
  required:
    name: Python CI
    needs: [changes, mcp, evals]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report
        shell: bash
        env:
          CHANGES: "${{ needs.changes.result }}"
          MCP: "${{ needs.mcp.result }}"
          EVALS: "${{ needs.evals.result }}"
        run: |
          set -euo pipefail
          if [ "${CHANGES}" != success ]; then
              echo "change detection ${CHANGES}" >&2
              exit 1
          fi
          status=0
          for result in "mcp=${MCP}" "evals=${EVALS}"; do
              case "${result#*=}" in
                  success | skipped) ;;
                  *) echo "${result}" >&2; status=1 ;;
              esac
          done
          exit "${status}"
