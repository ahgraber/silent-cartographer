[package]
name = "silent-cartographer"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "A persistent codebase knowledge graph answering precise, type-aware navigation for Rust."
license = "Apache-2.0"

[lib]
name = "silent_cartographer"
path = "src/lib.rs"

[[bin]]
name = "c10r"
path = "src/main.rs"

[dependencies]
# CLI surface (clap derive per project stack mapping).
clap = { version = "4", features = ["derive"] }
# Shell completion-script generation derived from the same clap `Command` tree.
clap_complete = "4"
# (De)serialization for the JSON output contract and config.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Embedded SQLite-core store; bundled so builds do not depend on a system libsqlite3.
rusqlite = { version = "0.38", features = ["bundled"] }
# Semantic index model: the SCIP protobuf schema the Rust backend emits.
scip = "0.9"
# Protobuf runtime for (de)serializing the SCIP index; version pinned to match `scip`.
protobuf = "=3.7.2"
# Syntax oracle: tree-sitter and the Rust and Python grammars.
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
# Content-hash gate over analyzed sources.
sha2 = "0.11"
# Derived variant lists for the closed vocabularies (the alignment rules). The list is generated
# from the enum, so a variant added to one cannot go missing from the accounting, the persisted
# counts, or any render site. Only the list is derived: each rule's stored tag stays a hand-written
# match, because those tags are persisted values and a Rust rename must not silently rewrite them.
strum = { version = "0.27", features = ["derive"] }
# Static code-embedding runtime for the semantic corpus. `local-only` removes the network path
# (the model is compiled into the binary); `fancy-regex` keeps the tokenizer pure Rust.
model2vec-rs = { version = "=0.2.1", default-features = false, features = ["local-only", "fancy-regex"] }
# Direct access to the same tokenizer implementation for chunk-size accounting: the exact version
# model2vec-rs pins, with the feature set its `fancy-regex` passthrough enables, so the build
# compiles one tokenizer and chunk counts measure exactly what the model receives.
tokenizers = { version = "=0.21.4", default-features = false, features = ["fancy-regex", "progressbar", "esaxx_fast"] }
# Vector KNN inside the SQLite store; the extension's C source is compiled in statically.
# Pinned exactly: the crate is pre-v1 and its on-disk format is warned unstable.
sqlite-vec = "=0.1.9"
# Error plumbing.
anyhow = "1"
thiserror = "2"
# Descriptive process title for host process identification.
proctitle = "0.1"

[build-dependencies]
# The model-payload fetch/verify script: manifest parsing and checksum verification.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"
