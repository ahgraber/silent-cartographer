# git-cliff: builds CHANGELOG.md for the `c10r` crate from Conventional Commits.
# Invoked by `just changelog c10r <bump>`; see ../docs/releasing.md.

[changelog]
header = """
# Changelog

All notable changes to `c10r` are documented here.
The format follows [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""
body = """
{% if version %}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}
## [Unreleased]
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
protect_breaking_commits = true

# Only the crate's own tag series. Without this, the `c10r-mcp-v*` tags would split
# the crate's changelog into sections that mean nothing to it.
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"

# A commit that touches only the Python subprojects or the specs is not a change to
# the binary. A commit touching both still appears.
exclude_paths = ["mcp/**", "evals/**", ".specs/**"]

commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Changed" },
  { message = "^refactor", group = "Changed" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Testing" },
  { message = "^revert", group = "Removed" },
  # Housekeeping that ships no behavior change to a user of the binary.
  { message = "^chore", skip = true },
  { message = "^ci", skip = true },
  { message = "^build", skip = true },
  { message = "^style", skip = true },
  { message = "^bump", skip = true },
  { message = ".*", group = "Other" },
]

filter_commits = false
sort_commits = "oldest"
