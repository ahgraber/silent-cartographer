[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "silent-cartographer"
version = "0.1.0"
description = "" # TODO
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "typer>=0.12",
    "fastmcp>=2.0",
]

[project.scripts]
c10r = "silent_cartographer.cli:main"
silent-cartographer-mcp = "silent_cartographer.server:main"

[dependency-groups]
dev = [
    "nox>=2024.10",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.15.12",
]
test = [
    "coverage>=7.6.9",
    "hypothesis>=6.0",
    "pip-audit>=2.10.0",
    "pyleak>=0.2.0",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6",
    "pytest-dependency~=0.6",
    "pytest-isolate>=0.0.13",
    "pytest-responses>=0.5.1",
    "pytest-subprocess>=1.5.3",
    "pytest-xdist>=3.8.0",
    "responses>=0.25.3",
]

[tool.uv]
package = true
default-groups = ["dev", "test"]

[tool.uv.build-backend]
module-name = "silent_cartographer"
module-root = "src/"

[tool.pytest.ini_options]
addopts = """
    -ra
    --strict-markers
    --strict-config
    --import-mode=importlib
    --tb=short
"""
asyncio_mode = "auto"
norecursedirs = ["*.egg", ".*", "build", "dist", "node_modules", "venv", ".venv"]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.paths]
source = ["src", "*/site-packages"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
