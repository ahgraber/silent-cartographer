[project]
name = "c10r-evals"
version = "0.1.0"
description = "Evaluation harness for c10r: paired localization benchmark, telemetry import, and paired analysis."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datacurve-pier==0.3.1",
    "datasets>=4.0",
    "mlflow>=3.0",
    "pyyaml>=6.0",
    "scipy>=1.14",
    "setproctitle>=1.3",
]

[project.scripts]
c10r-evals = "c10r_evals.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/c10r_evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 119
target-version = "py312"
