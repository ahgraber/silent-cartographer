# BuildKit daemon config for the builder `just builder` creates.
#
# A treatment tree is hundreds of images, and the docker-container driver keeps every
# intermediate layer in the builder's own cache on top of loading each finished image into the
# image store. Without a ceiling that cache grows until the machine's disk fills mid-build.
#
# `just builder` passes these settings to buildkitd as flags, translated by `c10r_evals.buildkitd`,
# which fails on any key it cannot translate.
#
# The label is what `just builder-check` reads: buildkitd reports it in `docker buildx inspect`
# only when it applied these settings, so a builder created without them fails the check.

[worker.oci]
gc = true
gckeepstorage = "60GB"

[worker.oci.labels]
c10r-cache-cap = "60GB"
