[project]
name = "c10r-mcp"
version = "0.1.0"
description = "An MCP server exposing the c10r code-graph CLI as tools."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastmcp==4.0.3",
  "setproctitle>=1.3",
]

[project.scripts]
c10r-mcp = "c10r_mcp.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=1",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "c10r_mcp"
module-root = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
